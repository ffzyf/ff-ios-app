# xcodegen 工程描述文件 —— FF大王 V2（原生 SwiftUI 重写）
# 生成命令（在工程根目录）：xcodegen generate
#
# 关键约束（设计文档 §1.3）：
#   · 部署目标 iOS 18.0，用 Xcode 26 / iOS 26 SDK 编译；玻璃能力按 #available 分流
#   · 只 iPhone（TARGETED_DEVICE_FAMILY = 1），只竖屏（见 Resources/Info.plist）
#   · 不生成 Info.plist（GENERATE_INFOPLIST_FILE = NO），改用 Resources/Info.plist
#   · 不写 ENABLE_BITCODE（Xcode 14 起已废弃）
name: SkyApp

options:
  bundleIdPrefix: top.skyzyf
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    # 不启用 Swift 6 严格并发：CI 是无签名编译，Sendable 报错只会拖慢落地（设计文档 §1.2）
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  SkyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.skyzyf.skyapp
        PRODUCT_NAME: SkyApp
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_PREVIEWS: "NO"

schemes:
  SkyApp:
    build:
      targets:
        SkyApp: all
    run:
      config: Debug
    archive:
      config: Release

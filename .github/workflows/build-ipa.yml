name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # 工程可能位于仓库根目录，也可能位于 ios/ 子目录，
      # 这里自动定位 project.yml 所在目录，避免路径写死后构建失败。
      - name: Locate project directory
        id: locate
        run: |
          set -euo pipefail
          if [ -f project.yml ]; then
            project_dir="."
          elif [ -f ios/project.yml ]; then
            project_dir="ios"
          else
            found="$(find . -maxdepth 4 -name project.yml -not -path './.git/*' -print 2>/dev/null | head -n 1 || true)"
            if [ -z "$found" ]; then
              echo "project.yml not found" >&2
              exit 1
            fi
            project_dir="$(dirname "$found")"
          fi
          echo "Project directory: $project_dir"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      # 必须用 -scheme + -destination：-derivedDataPath 只对 scheme 构建生效。
      # 走 legacy 的 target 构建时，产物会落在 <projdir>/build/Release-iphoneos/，
      # 而不是 build/Build/Products/Release-iphoneos/，导致找不到 .app。
      - name: Build (unsigned)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -project SkyApp.xcodeproj \
            -scheme SkyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 注意这里用 set -uo pipefail（不带 -e）：find 目录不存在时返回 1，
      # 若开 -e 会直接终止 step，让下面的排错分支变成死代码。
      # 另外 `find | head` 的 SIGPIPE(141) 也必须用 `|| true` 兜住。
      - name: Package IPA
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          set -uo pipefail
          echo "== .app candidates under $PROJECT_DIR =="
          find "$PROJECT_DIR" -maxdepth 6 -name '*.app' -type d -print 2>/dev/null || true
          APP="$(find "$PROJECT_DIR" -maxdepth 6 -name '*.app' -type d -print 2>/dev/null | head -n 1 || true)"
          if [ -z "${APP:-}" ]; then
            echo "::error::no .app produced; dumping build tree"
            ls -R "$PROJECT_DIR/build" 2>/dev/null | head -n 120 || true
            exit 1
          fi
          echo "APP=$APP"
          rm -rf Payload SkyApp.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SkyApp.ipa Payload
          ls -lh SkyApp.ipa
          md5 SkyApp.ipa || md5sum SkyApp.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyApp-unsigned-ipa
          path: SkyApp.ipa
          retention-days: 30
